{% extends "layout.html" %}
{% block content %}
<section id="hero">
  <div class="hero-left">
    <h2>Hi, I'm <span class="accent">Your Name</span></h2>

    <a class="btn" href="{{ url_for('projects') }}">See Projects</a>

</audio>
